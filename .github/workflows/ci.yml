
name: Python CI

on:
  push:
    branches: [clean-history]
  pull_request:
    branches: [clean-history]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CI tools
        run: python -m pip install pytest "ruff==0.17.1" pip-audit

      - name: Check code quality with Ruff
        run: python -m ruff check crop.py tests

      - name: Audit dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Run automated tests
        run: python -m pytest -v

      - name: Prepare application package
        run: |
          mkdir -p dist
          cp crop.py best_float16.tflite requirements.txt dist/

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: yolov5-app-package
          path: dist/
          retention-days: 7
